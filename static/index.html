<script>
"use strict";
const tg = window.Telegram && window.Telegram.WebApp;
const initData = (tg && tg.initData) || "";
const DEMO = !initData;
if (tg) { tg.ready(); tg.expand(); try { tg.disableVerticalSwipes(); tg.setHeaderColor("#0d0f18"); tg.setBackgroundColor("#0d0f18"); } catch (e) {} }
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => Number(n).toLocaleString("ru-RU");
function haptic(kind) { try { tg && tg.HapticFeedback.impactOccurred(kind); } catch (e) {} }
let toastTimer;
function toast(text) { const t = $("toast"); t.textContent = text; t.classList.add("on"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("on"), 2300); }

/* ---------- Демо-режим: тот же API, но локально (вне Telegram) ---------- */
const demo = (() => {
  const UPG = [["damage","Патроны","+15% к урону",100],["rate","Затвор","+6% к скорострельности",120],["hp","Закалка","+15 к здоровью",90],["armor","Бронежилет","+10 к броне",130],["speed","Кроссовки","+4% к скорости",110],["magnet","Магнит","+20% к радиусу сбора",80],["dog","Пёс Бублик","+25% к укусу пса",150]];
  const DEF = { hat: "cap", outfit: "plain", dog: "bublik", tracer: "yellow" };
  const SK = [["cap","hat","Кепка",0],["helmet","hat","Каска",800],["ushanka","hat","Ушанка",1200],["cowboy","hat","Шляпа",1800],["mohawk","hat","Ирокез",2500],["crown","hat","Корона",0,150],["plain","outfit","Обычный",0],["camo","outfit","Камуфляж",600],["hazmat","outfit","Химзащита",1200],["ninja","outfit","Алый",2000],["gold","outfit","Золотой",0,99],["bublik","dog","Бублик",0],["ryzhik","dog","Рыжик",500],["ugolek","dog","Уголёк",900],["robot","dog","Робопёс",0,75],["yellow","tracer","Жёлтые",0],["toxic","tracer","Ядовитые",700],["plasma","tracer","Плазма",1500],["fire","tracer","Огненные",0,50]].map(x => { const o = { id: x[0], slot: x[1], name: x[2] }; if (x[4]) o.stars = x[4]; else o.coins = x[3]; return o; });
  let s = { coins: 1500, best: 0, night: 1, levels: {}, streak: 0, day: 0, lastCoins: 0, owned: [], equipped: {}, weapons: [], weapon: "pistol" };
  try { s = Object.assign(s, JSON.parse(localStorage.getItem("night-demo") || "{}")); } catch (e) {}
  const ARMS = [["pistol","Пистолет","Надёжный и простой",0],["shotgun","Дробовик","Сносит толпу вблизи",1500],["smg","Автомат","Очень быстрая стрельба",2500],["sniper","Снайперка","Двойной урон по боссам, пробивает ряд",4000],["flame","Огнемёт","Жжёт всех рядом, бьёт близко",5000],["rocket","Базука","Взрыв задевает всех вокруг",6500],["rail","Рельсотрон","Луч пробивает всех на линии, сильнее по боссам",0,249]].map(x => { const o = { id: x[0], name: x[1], desc: x[2] }; if (x[4]) o.stars = x[4]; else o.coins = x[3]; return o; });
  if (!s.weaponGift) { s.weaponGift = 1; s.coins += 8000; s.weapons = s.weapons || []; s.weapon = s.weapon || "pistol"; }
  const save = () => { try { localStorage.setItem("night-demo", JSON.stringify(s)); } catch (e) {} };

/* Музыка синтезируется в браузере: своя, без файлов и чужих прав. */
function musicStep(ac, out, noise, t, step, mode, level, sec) {
  const CH = [[55, 0], [55, 0], [43.65, 0], [41.2, 1]];  // Am Am F E
  const bar = Math.floor(step / 16) % 4, s16 = step % 16, chord = CH[bar], root = chord[0];
  const third = chord[1] ? 1.26 : (bar === 2 ? 1.26 : 1.189), fifth = 1.498;
  function tone(freq, start, len, vol, type, cutoff) {
    const o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(.0001, start); g.gain.linearRampToValueAtTime(vol, start + Math.min(.015, len / 3)); g.gain.exponentialRampToValueAtTime(.0001, start + len);
    if (cutoff) { const f = ac.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = cutoff; o.connect(f).connect(g); } else o.connect(g);
    g.connect(out); o.start(start); o.stop(start + len + .02);
  }
  function hiss(start, len, vol, freq) {
    const n = ac.createBufferSource(), g = ac.createGain(), f = ac.createBiquadFilter(); n.buffer = noise; f.type = "highpass"; f.frequency.value = freq;
    g.gain.setValueAtTime(vol, start); g.gain.exponentialRampToValueAtTime(.0001, start + len); n.connect(f).connect(g).connect(out); n.start(start, Math.random() * .5, len + .02);
  }
  if (s16 === 0) { const L = sec * 16; for (const m of [2, 2 * third, 2 * fifth]) tone(root * m, t, L, mode === "menu" ? .05 : .035, "sawtooth", mode === "menu" ? 520 : 760); }
  if (mode === "menu") {
    if (s16 % 4 === 0) tone(root * 4 * [1, fifth, third, fifth][s16 / 4], t, sec * 7, .06, "triangle");
    return;
  }
  if ([0, 3, 6, 8, 11, 13].includes(s16)) tone(root * 2, t, sec * 1.8, .15, "sawtooth", 320 + level * 170);
  if (s16 % 4 === 0) { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(42, t + .1); g.gain.setValueAtTime(.3, t); g.gain.exponentialRampToValueAtTime(.0001, t + .18); o.connect(g).connect(out); o.start(t); o.stop(t + .2); }
  if (s16 % 2 === 0) hiss(t, .035, .045, 7000);
  if (level >= 1 && (s16 === 4 || s16 === 12)) hiss(t, .13, .13, 1400);
  if (level >= 1) { const arp = [1, third, fifth, 2, fifth, third, 1, fifth][s16 % 8]; tone(root * 8 * arp, t, sec * .9, .035, "square", 2200); }
  if (level >= 2) { const lead = [2, 0, 0, 1.78, 0, 0, 1.5, 0, 1.68, 0, 1.5, 0, 1.26, 0, 1.335, 0][s16]; if (lead && bar % 2 === 1) tone(root * 8 * lead, t, sec * 2.2, .05, "triangle"); }
  if (level >= 3 && s16 % 2 === 1) tone(root * 16, t, sec * .5, .025, "sawtooth", 3000);
}

const Sound = (() => {
  let ac = null, master = null, sfx = null, noise = null, timer = null, muted = false, mode = "menu", level = 0, step = 0, next = 0, bpm = 76;
  try { muted = localStorage.getItem("night-mute") === "1"; } catch (e) {}
  function buildNoise(c) { const b = c.createBuffer(1, c.sampleRate, c.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; return b; }
  function tick() {
    if (!ac || ac.state !== "running") return;
    if (next < ac.currentTime) next = ac.currentTime + .05;
    while (next < ac.currentTime + .22) {
      const sec = 60 / bpm / 4;
      musicStep(ac, master, noise, next, step, mode, level, sec);
      next += sec; step++;
    }
  }
  function apply() { if (master) { const t = ac.currentTime; master.gain.setTargetAtTime(muted ? 0 : .95, t, .03); sfx.gain.setTargetAtTime(muted ? 0 : .9, t, .03); } document.querySelectorAll(".snd").forEach(b => b.textContent = muted ? "🔇" : "🔊"); }
  function unlock() {
    try {
      if (!ac) {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        const comp = ac.createDynamicsCompressor(); comp.connect(ac.destination);
        master = ac.createGain(); master.gain.value = 0; master.connect(comp);
        sfx = ac.createGain(); sfx.gain.value = 0; sfx.connect(comp);
        noise = buildNoise(ac); timer = setInterval(tick, 60); apply();
      }
      if (ac.state === "suspended" && !document.hidden) ac.resume();
    } catch (e) {}
  }
  return {
    unlock, apply,
    get ctx() { return ac; }, get sfx() { return sfx; },
    toggle() { muted = !muted; try { localStorage.setItem("night-mute", muted ? "1" : "0"); } catch (e) {} unlock(); apply(); },
    setMode(m) { if (m !== mode) { mode = m; step = 0; bpm = m === "menu" ? 76 : 126; level = 0; } },
    setGame(lv, b) { level = lv; bpm = b; },
    sleep(on) { try { if (ac) on ? ac.suspend() : ac.resume(); } catch (e) {} },
    buildNoise,
  };
})();
addEventListener("pointerdown", Sound.unlock, true);

for (const id of ["snd1", "snd2", "snd3"]) $(id).addEventListener("click", e => { e.stopPropagation(); Sound.toggle(); });
Sound.apply();

function beep(freq, len, vol, type) {
  const audio = Sound.ctx; if (!audio || audio.state !== "running") return;
  try {
    const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime;
    o.type = type || "square"; o.frequency.setValueAtTime(freq, t); o.frequency.exponentialRampToValueAtTime(Math.max(40, freq * .5), t + len);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + len);
    o.connect(g).connect(Sound.sfx); o.start(t); o.stop(t + len);
  } catch (e) {}
}

function newGame() {
  const L = id => (P.levels && P.levels[id]) || 0;
  return {
    t: 0, kills: 0, lvl: 1, xp: 0, need: 4, spawn: 0, horde: 16, combo: 0, comboT: 0, noHit: 9, dashT: 0, dashCd: 0, dashX: 1, dashY: 0, frenzy: 0, barrel: 6, bolt: 2, blood: false, shot: 0, nade: 3, shake: 0, hurt: 0, revived: false, say: {}, over: false, pause: false,
    night: P.night, dawn: CFG.dawn,
    p: { x: 0, y: 0, hp: 100 + 15 * L("hp"), armor: 20 + 10 * L("armor"), dirx: 1, step: 0 },
    skin: Object.assign({}, P.equipped), weapon: P.weapon, w: WEAPONS[P.weapon] || WEAPONS.pistol, beams: [],
    s: { dmg: 12 * (1 + .15 * L("damage")), delay: .36 / (1 + .06 * L("rate")), hp: 100 + 15 * L("hp"), speed: 128 * (1 + .04 * L("speed")), magnet: 70 * (1 + .2 * L("magnet")), dogDmg: 14 * (1 + .25 * L("dog")), dogRate: 1, multi: 1, pierce: 0, saws: 0, nades: 0, armor: 20 + 10 * L("armor"), bolts: 0, vamp: 0, thorns: 0, dashCd: 3 },
    dog: { x: -30, y: 20, cd: 0, step: 0, dirx: 1 }, taken: {},
    barrels: [], drops: [], bolts: [], zs: [], bullets: [], shots: [], gems: [], parts: [], blasts: [], moveA: null,
  };
}

async function startRun() {
  try { runId = (await api("/run/start")).runId; } catch (err) { return toast(err.message); }
  G = newGame(); finishing = false;
  $("menu").classList.remove("on"); $("hud").classList.add("on"); $("dash").classList.add("on");
  Sound.setMode("game");
  for (let i = 0; i < 7; i++) spawnZ("walker", i * .9);
  beep(90, .4, .15, "sawtooth");
  say("Ночь " + G.night);
}

let sayTimer;
function say(text) { const s = $("say"); s.textContent = text; s.style.opacity = 1; clearTimeout(sayTimer); sayTimer = setTimeout(() => s.style.opacity = 0, 1700); }
function once(key, text) { if (!G.say[key]) { G.say[key] = 1; say(text); } }

function spawnZ(kind, angle) {
  const a = angle !== undefined ? angle : G.moveA !== null && Math.random() < .6 ? G.moveA + (Math.random() - .5) * 1.8 : Math.random() * 6.283, R = Math.hypot(W, H) / 2 / zoom + 40, T = TYPES[kind], g = G;
  const hpMul = kind === "boss" ? (1 + g.t / 600) * (1 + .3 * (g.night - 1)) : (1 + g.t / 190) * (1 + .4 * (g.night - 1)), dmgMul = 1 + .2 * (g.night - 1);
  g.zs.push({ x: g.p.x + Math.cos(a) * R, y: g.p.y + Math.sin(a) * R, kind, r: T.r, hp: T.hp * hpMul, max: T.hp * hpMul, speed: T.speed * (.9 + Math.random() * .2) * (1 + g.t / 650), dmg: T.dmg * dmgMul, color: T.color, gems: T.gems, cd: 0, step: Math.random() * 6, flash: 0, saw: 0 });
}

function burst(x, y, color, n, power) {
  const g = G; if (g.parts.length > 220) return;
  for (let i = 0; i < n; i++) { const a = Math.random() * 6.283, v = (power || 90) * (.4 + Math.random()); g.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: .35 + Math.random() * .3, color }); }
}

function hit(z, dmg) {
  z.hp -= dmg; z.flash = .08;
  if (z.hp <= 0 && !z.dead) {
    z.dead = true; G.kills++;
    const g = G;
    g.combo++; g.comboT = 2.4;
    if (g.combo % 25 === 0 || Math.random() < .035) dropBonus(z.x, z.y);
    if (g.s.vamp && g.kills % (13 - g.s.vamp * 4) === 0) g.p.hp = Math.min(g.s.hp, g.p.hp + 6);
    if (z.kind === "bomber") explode(z.x, z.y, 82, g.s.dmg * 3, z.dmg);
    burst(z.x, z.y, "#7ec850", z.kind === "boss" ? 40 : 6);
    for (let i = 0; i < z.gems; i++) G.gems.push({ x: z.x + (Math.random() - .5) * 20 * Math.min(z.gems, 3), y: z.y + (Math.random() - .5) * 20 * Math.min(z.gems, 3), v: G.blood ? 2 : 1 });
    if (z.kind === "boss") { dropBonus(z.x, z.y); say("Босс повержен!"); G.shake = .5; beep(70, .6, .25, "sawtooth"); haptic("heavy"); }
    else beep(180 + Math.random() * 80, .06, .03);
  }
}

function fireBeam(x, y, a, len, dmg, big) {
  const g = G, cx = Math.cos(a), cy = Math.sin(a);
  g.beams.push({ x1: x, y1: y, x2: x + cx * len, y2: y + cy * len, life: .16 });
  for (const z of g.zs) {
    if (z.dead) continue;
    const dx = z.x - x, dy = z.y - 12 - y, along = dx * cx + dy * cy;
    if (along > 0 && along < len && Math.abs(dx * cy - dy * cx) < z.r + 7) { hit(z, dmg * (z.kind === "boss" || z.kind === "tank" ? big : 1)); burst(z.x, z.y - 12, "#8fb7ff", 3, 90); }
  }
  for (const o of g.barrels) { const dx = o.x - x, dy = o.y - 12 - y, along = dx * cx + dy * cy; if (!o.gone && along > 0 && along < len && Math.abs(dx * cy - dy * cx) < 16) popBarrel(o); }
}

function hurt(dmg) {
  const g = G; if (g.dashT > 0) return;
  g.noHit = 0; g.combo = 0;
  const soak = Math.min(g.p.armor, dmg); g.p.armor -= soak; dmg -= soak; g.p.hp -= dmg;
  g.shake = Math.max(g.shake, .13); haptic("light");
  if (dmg > 0) { g.hurt = 1; burst(g.p.x, g.p.y - 10, "#ff4d5e", 3); beep(120, .1, .08); }
  else { burst(g.p.x, g.p.y - 10, "#8fb7ff", 4); beep(340, .06, .06, "triangle"); }
}

function explode(x, y, R, dmg, toPlayer) {
  const g = G;
  g.blasts.push({ x, y, r: 0, t: .3 }); g.shake = Math.max(g.shake, .22); burst(x, y, "#ffb15c", 14, 170); beep(90, .28, .16, "sawtooth");
  for (const z of g.zs) if (!z.dead && (z.x - x) ** 2 + (z.y - y) ** 2 < R * R) hit(z, dmg);
  for (const b of g.barrels) if (!b.gone && (b.x - x) ** 2 + (b.y - y) ** 2 < R * R) popBarrel(b);
  if (toPlayer && (g.p.x - x) ** 2 + (g.p.y - y) ** 2 < R * R) hurt(toPlayer);
}

function popBarrel(b) { b.gone = true; explode(b.x, b.y, 118, G.s.dmg * 5 + 35, 0); }

const BONUS = {
  med:    { c: "#ff4d5e", l: "+", say: "Аптечка" },
  vest:   { c: "#8fb7ff", l: "Б", say: "Броня починена" },
  bomb:   { c: "#ffb15c", l: "!", say: "Бомба!" },
  frenzy: { c: "#ffe36b", l: "»", say: "Ярость!" },
};
function dropBonus(x, y) { const k = Object.keys(BONUS); if (G.drops.length < 6) G.drops.push({ x, y, kind: k[Math.floor(Math.random() * k.length)], life: 11 }); }
function takeBonus(d) {
  const g = G; d.life = 0; say(BONUS[d.kind].say); beep(640, .18, .12, "triangle"); haptic("medium");
  if (d.kind === "med") g.p.hp = Math.min(g.s.hp, g.p.hp + 40);
  if (d.kind === "vest") g.p.armor = g.s.armor;
  if (d.kind === "frenzy") g.frenzy = 7;
  if (d.kind === "bomb") { g.blasts.push({ x: g.p.x, y: g.p.y, r: 0, t: .5 }); g.shake = .5; for (const z of g.zs) if ((z.x - g.p.x) ** 2 + (z.y - g.p.y) ** 2 < 420 ** 2) hit(z, g.s.dmg * 7); }
}

function dash() {
  const g = G; if (!g || g.pause || g.over || g.dashCd > 0) return;
  let x = input.dx, y = input.dy;
  if (keys.KeyA || keys.ArrowLeft) x -= 1; if (keys.KeyD || keys.ArrowRight) x += 1; if (keys.KeyW || keys.ArrowUp) y -= 1; if (keys.KeyS || keys.ArrowDown) y += 1;
  const m = Math.hypot(x, y); if (m < .05) { x = g.p.dirx; y = 0; } else { x /= m; y /= m; }
  g.dashX = x; g.dashY = y; g.dashT = .2; g.dashCd = g.s.dashCd; beep(260, .14, .09, "sawtooth"); haptic("light");
}
$("dash").addEventListener("pointerdown", e => { e.preventDefault(); e.stopPropagation(); dash(); });

function nearest(x, y, range) { let best = null, bd = range * range; for (const z of G.zs) { const d = (z.x - x) ** 2 + (z.y - y) ** 2; if (d < bd && !z.dead) { bd = d; best = z; } } return best; }

function gainXp(v) {
  const g = G; g.xp += v;
  if (g.xp >= g.need) { g.xp -= g.need; g.lvl++; g.need = 5 + Math.floor(g.lvl * 2.6); levelUp(); }
}

function levelUp() {
  const g = G; g.pause = true; release(); beep(520, .25, .12, "triangle"); haptic("medium");
  const pool = PERKS.filter(p => !p.max || (g.taken[p.id] || 0) < p.max).sort(() => Math.random() - .5).slice(0, 3);
  openModal(`<h2>Новый уровень</h2><p class="sub">Выбери одно</p>` + pool.map(p => `<button class="perk" data-p="${p.id}"><b>${p.name}</b><small>${p.d}</small></button>`).join(""));
  $("box").onclick = e => {
    const b = e.target.closest("[data-p]"); if (!b) return;
    const perk = PERKS.find(x => x.id === b.dataset.p);
    perk.f(g); g.taken[perk.id] = (g.taken[perk.id] || 0) + 1;
    $("box").onclick = null; closeModal(); g.pause = false;
  };
}

function step(dt) {
  const g = G, p = g.p, s = g.s;
  g.t += dt; g.shake = Math.max(0, g.shake - dt); g.hurt = Math.max(0, g.hurt - dt * 2);

  let mx = input.dx, my = input.dy;
  if (keys.KeyA || keys.ArrowLeft) mx -= 1; if (keys.KeyD || keys.ArrowRight) mx += 1;
  if (keys.KeyW || keys.ArrowUp) my -= 1; if (keys.KeyS || keys.ArrowDown) my += 1;
  const m = Math.hypot(mx, my); if (m > 1) { mx /= m; my /= m; }
  g.dashCd = Math.max(0, g.dashCd - dt); g.frenzy = Math.max(0, g.frenzy - dt); g.noHit += dt;
  if (g.dashT > 0) { g.dashT -= dt; p.x += g.dashX * s.speed * 3.6 * dt; p.y += g.dashY * s.speed * 3.6 * dt; burst(p.x, p.y - 8, "#ffffff", 1, 30); }
  else { p.x += mx * s.speed * dt; p.y += my * s.speed * dt; }
  if (g.noHit > 5) p.armor = Math.min(s.armor, p.armor + s.armor * .14 * dt);
  if (g.comboT > 0 && (g.comboT -= dt) <= 0) g.combo = 0;
  g.blood = g.t > 165 && g.t < 190;
  Sound.setGame(g.blood || g.zs.some(z => z.kind === "boss") ? 3 : g.t > 120 ? 2 : g.t > 14 ? 1 : 0, 126 + Math.min(22, g.t * .075) + (g.blood ? 6 : 0));
  g.moveA = m > .05 ? Math.atan2(my, mx) : null;
  if (m > .05) { p.step += dt * 11; if (Math.abs(mx) > .1) p.dirx = Math.sign(mx); }

  /* Появление врагов. Минимальный интервал согласован с серверным лимитом убийств. */
  g.spawn -= dt;
  if (g.spawn <= 0 && g.zs.length < 110) {
    g.spawn = Math.max(.17, (.6 - g.t * .0014) / (1 + .1 * (g.night - 1)) * (g.blood ? .6 : 1));
    const r = Math.random();
    spawnZ(g.t > 90 && r < .09 ? "tank" : g.t > 30 && r < .19 ? "bomber" : g.t > 55 && r < .31 ? "spitter" : g.t > 18 && r < .55 ? "runner" : "walker");
  }
  g.horde -= dt;
  if (g.horde <= 0) { g.horde = 35; const a = Math.random() * 6.283; for (let i = 0; i < 10; i++) spawnZ("walker", a + i * .09); say("Толпа!"); }
  if (g.t > 18) once("run", "Бегуны!");
  if (g.t > 30) once("bomb", "Осторожно: бомберы!");
  if (g.blood) once("blood", "Кровавая луна!");
  if (g.t > 55) once("spit", "Плевуны!");
  if (g.t > 90) once("tank", "Громилы!");
  if (g.t > 120 && !g.say.b1) { g.say.b1 = 1; spawnZ("boss"); say("БОСС"); g.shake = .4; }
  if (g.t > 240 && !g.say.b2) { g.say.b2 = 1; spawnZ("boss"); spawnZ("boss", Math.random() * 6.283); say("ДВА БОССА"); g.shake = .4; }
  if (g.t > 275) once("dawn", "Светает. Держись!");

  /* Стрельба */
  g.shot -= dt;
  if (g.shot <= 0) {
    const w = g.w, reach = w.beam || w.speed * w.life;
    let target = nearest(p.x, p.y, Math.min(reach, 430));
    if (target && w.prefer) for (const z of g.zs) if (!z.dead && z.max > target.max && (z.x - p.x) ** 2 + (z.y - p.y) ** 2 < 470 ** 2) target = z;
    if (target) {
      g.shot = s.delay * w.delay * (g.frenzy > 0 ? .45 : 1);
      const base = Math.atan2(target.y - p.y, target.x - p.x);
      p.dirx = Math.cos(base) < 0 ? -1 : 1; p.aim = base;
      if (w.sound) beep(w.sound[0], w.sound[1], w.sound[2], "sawtooth");
      const dmg = s.dmg * w.dmg, count = w.shots + s.multi - 1;
      for (let i = 0; i < count; i++) {
        const a = base + (i - (count - 1) / 2) * w.fan + (Math.random() - .5) * w.inacc;
        if (w.beam) { fireBeam(p.x, p.y - 8, a, w.beam, dmg, w.big); continue; }
        g.bullets.push({ x: p.x, y: p.y - 8, vx: Math.cos(a) * w.speed, vy: Math.sin(a) * w.speed, life: w.life * (w.inacc ? .85 + Math.random() * .3 : 1), left: s.pierce + w.pierce, seen: new Set(), dmg, big: w.big || 1, aoe: w.aoe, size: w.size, color: w.color });
      }
    }
  }
  for (const b of g.bullets) {
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    for (const z of g.zs) {
      if (z.dead || b.seen.has(z) || (z.x - b.x) ** 2 + (z.y - b.y) ** 2 > (z.r + 5) ** 2) continue;
      b.seen.add(z);
      if (b.aoe) { b.life = 0; hit(z, b.dmg); explode(b.x, b.y, b.aoe, b.dmg, 0); break; }
      hit(z, b.dmg * (z.kind === "boss" || z.kind === "tank" ? b.big : 1)); burst(b.x, b.y, "#c8485a", 2, 60);
      if (b.left-- <= 0) { b.life = 0; break; }
    }
  }
  for (const b of g.bullets) for (const o of g.barrels) if (b.life > 0 && !o.gone && (o.x - b.x) ** 2 + (o.y - b.y) ** 2 < 17 * 17) { b.life = 0; popBarrel(o); }
  g.bullets = g.bullets.filter(b => b.life > 0);
  for (const b of g.beams) b.life -= dt;
  g.beams = g.beams.filter(b => b.life > 0);
  g.barrel -= dt;
  if (g.barrel <= 0) { g.barrel = 8; if (g.barrels.length < 6) { const a = Math.random() * 6.283, R = 170 + Math.random() * 130; g.barrels.push({ x: p.x + Math.cos(a) * R, y: p.y + Math.sin(a) * R }); } }
  g.barrels = g.barrels.filter(b => !b.gone && (b.x - p.x) ** 2 + (b.y - p.y) ** 2 < 800 ** 2);
  for (const d of g.drops) { d.life -= dt; if ((d.x - p.x) ** 2 + (d.y - p.y) ** 2 < 30 * 30) takeBonus(d); }
  g.drops = g.drops.filter(d => d.life > 0);
  if (s.bolts) {
    g.bolt -= dt;
    if (g.bolt <= 0) {

        seen.add(t); g.bolts.push({ x1: from.x, y1: from.y, x2: t.x, y2: t.y - 12, life: .14 }); hit(t, s.dmg * 2.2); from = { x: t.x, y: t.y - 12 };

  }

  }
  if (s.saws) for (let i = 0; i < s.saws; i++) {
    const a = g.t * 3.4 + i * 6.283 / s.saws, x = p.x + Math.cos(a) * 72, y = p.y + Math.sin(a) * 72;

  /* Зомби */
  for (let i = 0; i < g.zs.length; i++) {
    const z = g.zs[i]; if (z.dead) continue;
    const dx = p.x - z.x, dy = p.y - z.y, dd = Math.hypot(dx, dy) || 1;
    if (z.kind === "bomber" && dd < 36) { hit(z, 1e9); continue; }
    if (z.kind !== "spitter" || dd > 200) { z.x += dx / dd * z.speed * dt; z.y += dy / dd * z.speed * dt; }
    else if (z.cd <= 0) { z.cd = 2.1; g.shots.push({ x: z.x, y: z.y - 18, vx: dx / dd * 205, vy: dy / dd * 205, life: 2.4, dmg: z.dmg * 1.3 }); }
    z.step += dt * (z.speed / 7); z.flash -= dt; z.saw -= dt; z.cd -= dt;
    for (let j = i + 1; j < g.zs.length; j++) {

      if (a2 < min * min && a2 > .01) { const a = Math.sqrt(a2), push = (min - a) * .5 / a; z.x -= ax * push; z.y -= ay * push; o.x += ax * push; o.y += ay * push; }

}

function die() {
  const g = G; g.pause = true; release(); beep(70, .7, .2, "sawtooth"); haptic("heavy");
  if (g.revived || !adsReady()) return finishRun(false);
  openModal(`<h2>Тебя съели</h2><p class="sub">Осталось ${clock(g.dawn - g.t)} до рассвета. Один шанс за ночь.</p>
    <button class="big" id="rev">ВОСКРЕСНУТЬ ЗА РЕКЛАМУ</button><button class="ghost" id="giveup">Сдаться</button>`);
  $("giveup").onclick = () => { closeModal(); finishRun(false); };
  $("rev").onclick = async e => {
    e.target.disabled = true;
    closeModal();
    const ok = await showAd();
    if (!ok) { toast("Реклама недоступна"); return finishRun(false); }
    g.revived = true; g.p.hp = g.s.hp * .6; g.p.armor = g.s.armor;
    for (const z of g.zs) if ((z.x - g.p.x) ** 2 + (z.y - g.p.y) ** 2 < 200 ** 2) { const a = Math.atan2(z.y - g.p.y, z.x - g.p.x); z.x += Math.cos(a) * 220; z.y += Math.sin(a) * 220; }
    g.blasts.push({ x: g.p.x, y: g.p.y, r: 0, t: .4 }); g.pause = false;
  };
}

const clock = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };

async function finishRun(dawn) {
  if (finishing) return; finishing = true;
  const g = G; g.pause = true; g.over = true; release(); $("dash").classList.remove("on"); Sound.setMode("menu");
  const body = { runId, kills: g.kills, seconds: Math.floor(g.t), dawn };
  let r = null, error = "";
  for (let i = 0; i < 3 && !r; i++) {
    try { r = await api("/run/finish", body); }
    catch (err) { error = err.message; await new Promise(ok => setTimeout(ok, 900)); }
  }
  $("hud").classList.remove("on");
  if (!r) { openModal(`<h2>Нет связи</h2><p class="sub">${esc(error)}. Монеты за этот забег не начислены.</p><button class="big" id="home">В МЕНЮ</button>`); $("home").onclick = goHome; return; }
  setProfile(r.profile);
  const canDouble = adsReady() && r.coins > 0;
  openModal(`<h2>${r.dawn ? "Ты дожил!" : "Ночь победила"}</h2>
    <p class="sub">${g.kills} убито · ${clock(g.t)} · ${fmt(r.score)} очков${r.score >= r.profile.best ? " · рекорд" : ""}</p>
    <div class="gain">+${fmt(r.coins)}</div>
    ${canDouble ? `<button class="ghost gold" id="dbl">Удвоить за рекламу</button>` : ""}
    <div style="height:9px"></div><button class="big" id="again">ЕЩЁ РАЗ</button>
    <button class="ghost" id="brag">Бросить вызов другу</button><button class="ghost" id="home">В меню</button>`);
  $("again").onclick = () => { closeModal(); G = null; startRun(); };
  $("home").onclick = goHome;
  $("brag").onclick = () => share(`Я набрал ${fmt(r.score)} очков. Побьёшь?`);
  if (canDouble) $("dbl").onclick = async e => {
    e.target.disabled = true;
    const ok = await showAd();
    if (!ok) { e.target.disabled = false; return toast("Реклама недоступна"); }
    for (let i = 0; i < 6; i++) {
      try { const c = await api("/ad/claim", { runId }); setProfile(c.profile); e.target.textContent = "Монеты удвоены"; haptic("medium"); return; }
      catch (err) { error = err.message; await new Promise(w => setTimeout(w, 1000)); }
    }
    toast(error);
  };
}

function goHome() { closeModal(); G = null; $("dash").classList.remove("on"); Sound.setMode("menu"); $("hud").classList.remove("on"); $("menu").classList.add("on"); tab = "home"; render(); }

document.addEventListener("visibilitychange", () => {
  Sound.sleep(document.hidden);
  if (!document.hidden || !G || G.pause || G.over) return;
  const g = G; g.pause = true; release();
  openModal(`<h2>Пауза</h2><button class="big" id="cont">ПРОДОЛЖИТЬ</button>`);
  $("cont").onclick = () => { closeModal(); g.pause = false; };
});

/* ---------- Рисование ---------- */
function hash(x, y) { let h = (x * 374761 + y * 668265) | 0; h = (h ^ (h >> 13)) * 127413; return ((h ^ (h >> 16)) >>> 0) / 4294967295; }

  for (let i = x0; i <= x1; i++) for (let j = y0; j <= y1; j++) {
    const h = hash(i, j), x = i * S + hash(j, i) * 90, y = j * S + h * 90;
    if (h < .45) { ctx.strokeStyle = "#2a3f33"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 4, y - 9); ctx.moveTo(x + 5, y); ctx.lineTo(x + 7, y - 8); ctx.stroke(); }
    else if (h < .62) { ctx.fillStyle = "#26352d"; ctx.beginPath(); ctx.ellipse(x, y, 24 + h * 20, 11 + h * 8, 0, 0, 6.3); ctx.fill(); }
    else if (h < .72) { ctx.fillStyle = "#3b4150"; ctx.fillRect(x - 11, y - 26, 22, 26); ctx.beginPath(); ctx.arc(x, y - 26, 11, Math.PI, 0); ctx.fill(); ctx.strokeStyle = "#252a36"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, y - 29); ctx.lineTo(x, y - 12); ctx.moveTo(x - 6, y - 23); ctx.lineTo(x + 6, y - 23); ctx.stroke(); }
    else if (h < .78) { ctx.strokeStyle = "#141c19"; ctx.lineWidth = 5; ctx.lineCap = "round"; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y - 46); ctx.moveTo(x, y - 26); ctx.lineTo(x - 18, y - 46); ctx.moveTo(x, y - 34); ctx.lineTo(x + 15, y - 54); ctx.stroke(); }
  }
}

function stick(x, y, r, step, color, dir, zombie, flash) {

  ctx.strokeStyle = flash ? "#fff" : color; ctx.lineWidth = Math.max(3, r * .32); ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.beginPath();
  ctx.moveTo(x, top); ctx.lineTo(x, hip);
  ctx.moveTo(x, hip); ctx.lineTo(x + sw, y); ctx.moveTo(x, hip); ctx.lineTo(x - sw, y);
  if (zombie) { const j = Math.sin(step * 1.3) * r * .18; ctx.moveTo(x, top + r * .3); ctx.lineTo(x + dir * r * 1.15, top + r * .25 + j); ctx.moveTo(x, top + r * .5); ctx.lineTo(x + dir * r * 1.05, top + r * .7 - j); }

  ctx.fillStyle = flash ? "#fff" : color; ctx.beginPath(); ctx.arc(x, top - r * .5, r * .56, 0, 6.3); ctx.fill();

}

const OUTFITS = { plain: "#f3ead6", camo: "#86a35f", hazmat: "#ffd23f", ninja: "#e0475a", gold: "#ffcf4a" };
const TRACERS = { yellow: "#ffe36b", toxic: "#7dff6a", plasma: "#62c5ff", fire: "#ff7a3d" };
const DOGS = { bublik: ["#eee7da", "#20222c"], ryzhik: ["#e08a3c", "#7a3f12"], ugolek: ["#4a4e60", "#1c1e28"], robot: ["#aeb7c9", "#5c6a85"] };

function drawHat(kind, x, y, dir) {
  const fill = (c, f) => { ctx.fillStyle = c; ctx.beginPath(); f(); ctx.fill(); };
  if (kind === "cap") { fill("#ff6b3d", () => ctx.arc(x, y, 7.6, Math.PI, 0)); ctx.fillRect(x + (dir > 0 ? 0 : -13), y - 2, 13, 3); }
  else if (kind === "helmet") { fill("#566b45", () => ctx.arc(x, y - 1, 9, Math.PI, 0)); ctx.fillStyle = "#3f5033"; ctx.fillRect(x - 11, y - 2, 22, 3); }
  else if (kind === "ushanka") { fill("#7a5a3c", () => ctx.arc(x, y - 1, 9, Math.PI, 0)); ctx.fillStyle = "#b08a62"; ctx.fillRect(x - 10, y - 3, 20, 4); ctx.fillRect(x - 11, y - 1, 4, 10); ctx.fillRect(x + 7, y - 1, 4, 10); }
  else if (kind === "cowboy") { fill("#a8763e", () => ctx.ellipse(x, y - 1, 16, 3.4, 0, 0, 6.3)); fill("#8c5f2e", () => ctx.arc(x, y - 3, 7.5, Math.PI, 0)); ctx.fillRect(x - 7.5, y - 3, 15, 2); }
  else if (kind === "mohawk") { ctx.fillStyle = "#ff3b7f"; for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(x + i * 3.2 - 2.4, y - 4); ctx.lineTo(x + i * 3.2, y - 15 + Math.abs(i) * 1.5); ctx.lineTo(x + i * 3.2 + 2.4, y - 4); ctx.fill(); } }
  else if (kind === "crown") { ctx.fillStyle = "#ffd24a"; ctx.beginPath(); ctx.moveTo(x - 9, y - 1); ctx.lineTo(x - 9, y - 11); ctx.lineTo(x - 4.5, y - 5.5); ctx.lineTo(x, y - 13); ctx.lineTo(x + 4.5, y - 5.5); ctx.lineTo(x + 9, y - 11); ctx.lineTo(x + 9, y - 1); ctx.fill(); ctx.fillStyle = "#e0475a"; ctx.beginPath(); ctx.arc(x, y - 4, 1.8, 0, 6.3); ctx.fill(); }
}

function drawPlayer(p, skin, armored, dashing) {
  const body = OUTFITS[skin.outfit] || OUTFITS.plain;
  if (dashing) { ctx.globalAlpha = .35; stick(p.x - (p.dashX || 0) * 18, p.y - (p.dashY || 0) * 18, 13, p.step, body, p.dirx, false, false); ctx.globalAlpha = 1; }

  const top = p.y - 21.5, a = p.aim === undefined ? (p.dirx > 0 ? 0 : Math.PI) : p.aim;
  if (armored) { ctx.strokeStyle = "#8fb7ff"; ctx.lineWidth = 8; ctx.lineCap = "round"; ctx.beginPath(); ctx.moveTo(p.x, top + 3); ctx.lineTo(p.x, top + 13); ctx.stroke(); }
  ctx.strokeStyle = body; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(p.x, top + 4); ctx.lineTo(p.x + Math.cos(a) * 13, top + 5 + Math.sin(a) * 13); ctx.stroke();

  ctx.strokeStyle = gun[2]; ctx.lineWidth = gun[1]; ctx.beginPath(); ctx.moveTo(p.x + Math.cos(a) * 11, top + 5 + Math.sin(a) * 11); ctx.lineTo(p.x + Math.cos(a) * gun[0], top + 5 + Math.sin(a) * gun[0]); ctx.stroke();
  drawHat(skin.hat, p.x, top - 6.5, p.dirx);
}

function drawDog(d, skin) {
  const b = Math.sin(d.step) * 2.5, x = d.x, y = d.y, s = d.dirx, c = DOGS[skin.dog] || DOGS.bublik;
  ctx.fillStyle = "#0005"; ctx.beginPath(); ctx.ellipse(x, y + 1, 13, 4, 0, 0, 6.3); ctx.fill();
  ctx.strokeStyle = c[1]; ctx.lineWidth = 3; ctx.lineCap = "round"; ctx.beginPath(); ctx.moveTo(x - 8, y - 7); ctx.lineTo(x - 8 + b, y); ctx.moveTo(x + 7, y - 7); ctx.lineTo(x + 7 - b, y); ctx.moveTo(x - 11 * s, y - 12); ctx.lineTo(x - 17 * s, y - 18 + b); ctx.stroke();
  ctx.fillStyle = c[0]; ctx.beginPath(); ctx.ellipse(x, y - 10, 12, 6, 0, 0, 6.3); ctx.fill();
  ctx.fillStyle = c[1]; ctx.beginPath(); ctx.ellipse(x - 4 * s, y - 11, 5, 4, 0, 0, 6.3); ctx.fill(); ctx.beginPath(); ctx.arc(x + 12 * s, y - 16, 6, 0, 6.3); ctx.fill();
  ctx.fillStyle = skin.dog === "robot" ? "#62f0ff" : c[0]; ctx.beginPath(); ctx.arc(x + 15 * s, y - 15, 2.6, 0, 6.3); ctx.fill();

let previewT = 0;
function drawPreview(dt) {
  const el = $("preview"); if (!el) return;
  previewT += dt;
  const dpr = Math.min(2, devicePixelRatio || 1), w = el.clientWidth, h = el.clientHeight;
  if (el.width !== Math.round(w * dpr)) { el.width = Math.round(w * dpr); el.height = Math.round(h * dpr); }
  const main = ctx; ctx = el.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
  ctx.translate(w / 2, h * .82); ctx.scale(3, 3);
  drawPlayer({ x: -24, y: 0, dirx: 1, weaponId: P.weapon, step: Math.sin(previewT * 1.6) * .6, aim: -.12 + Math.sin(previewT) * .08 }, P.equipped, false, false);
  drawDog({ x: 42, y: 0, dirx: -1, step: previewT * 7 }, P.equipped);
  const tr = TRACERS[P.equipped.tracer] || TRACERS.yellow, q = (previewT * 90) % 90;

function drawMoon(x, y, r, a) {

  ctx.fillStyle = "#d9caa1"; for (const c of [[-.35,-.2,.18],[.3,.25,.14],[.1,-.45,.1],[-.1,.45,.09]]) { ctx.beginPath(); ctx.arc(x + c[0] * r, y + c[1] * r, c[2] * r, 0, 6.3); ctx.fill(); }
  ctx.globalAlpha = 1;
}

function renderGame() {
  const g = G, p = g.p, vw = W / zoom, vh = H / zoom;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.save();
  const sh = g.shake > 0 ? 7 * g.shake / .3 : 0;
  ctx.translate(W / 2 + (Math.random() - .5) * sh, H / 2 + (Math.random() - .5) * sh); ctx.scale(zoom, zoom); ctx.translate(-p.x, -p.y);
  ground(p.x, p.y, vw + 40, vh + 40);
  for (const c of g.gems) { ctx.fillStyle = "#62c5ff"; ctx.beginPath(); ctx.moveTo(c.x, c.y - 6); ctx.lineTo(c.x + 4.5, c.y); ctx.lineTo(c.x, c.y + 6); ctx.lineTo(c.x - 4.5, c.y); ctx.fill(); }

  list.push({ y: p.y, f: () => drawPlayer(Object.assign(p, { dashX: g.dashX, dashY: g.dashY, weaponId: g.weapon }), g.skin, p.armor > 0, g.dashT > 0) }, { y: g.dog.y, f: () => drawDog(g.dog, g.skin) });
